name: Feature request / 功能建议
description: Suggest a focused improvement. / 提出范围明确的改进建议。
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 问题
      description: What workflow is difficult today? / 当前哪个使用流程存在困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的替代方案
